[project]
name = "astra-api"
version = "0.1.0"
description = "ASTRA - Proactive Settlement Risk & Relocation Intelligence (SIH26191)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    # The analytical core reads the vendored rasters and measures on them at
    # request time, so the geospatial stack is a runtime dependency, not a
    # build-time one.
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.2",
    # The relocation optimiser. CP-SAT is CPU-only and ships as a wheel.
    "ortools>=9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Fetching the study-area clips and rebuilding the derived surfaces. None of
# this runs at request time or on demo day; the outputs are vendored.
data = [
    "requests>=2.31",
    "pillow>=10.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "E402", "F", "I", "UP", "B", "DTZ", "PYI"]
ignore = ["B008"]
