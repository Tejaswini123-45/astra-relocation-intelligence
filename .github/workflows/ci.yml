name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, integrity gate, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev,data]"

      - name: Lint
        run: ruff check apps/api scripts

      - name: Fixture integrity gate
        run: python scripts/validate_fixtures.py

      - name: Tests
        run: pytest
        working-directory: apps/api

      - name: Back-test and sensitivity match the committed artifact
        # Not a smoke test: it recomputes the AUC and the rank stability and
        # fails if the headline figures have moved. A refactor that quietly
        # changes a number the Model & Provenance screen is showing has to break
        # the build rather than turn into a better-looking figure.
        run: python scripts/backtest.py --check

      - name: OpenAPI schema is in sync with the committed contract
        run: |
          python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  frontend:
    name: Frontend - types, lint, build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generated types match the committed OpenAPI schema
        run: |
          npm run contracts
          git diff --exit-code packages/contracts/src/api.ts

      - name: Typecheck
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web

  e2e:
    name: End to end - the judge journey in a real browser
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        run: npm run build:web

      # The point of these tests is that nothing is stubbed, so the API they run
      # against is the real one over the vendored study-area data.
      - name: Start the API
        run: |
          uvicorn astra.main:app --port 8000 --host 127.0.0.1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "the API did not become healthy" >&2
          exit 1
        working-directory: apps/api

      - name: End-to-end
        run: npm run e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
